name: Sync Notion and deploy trip website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # UTC 기준 6시간 간격. 일정 지연 가능.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch safely filtered content from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_GUIDE_PAGE_ID: ${{ vars.NOTION_GUIDE_PAGE_ID }}
          NOTION_ORIGINAL_PAGE_ID: ${{ vars.NOTION_ORIGINAL_PAGE_ID }}
        run: |
          if [ -n "$NOTION_TOKEN" ]; then npm run sync; else echo "NOTION_TOKEN 미설정: 초기 데이터를 사용합니다."; fi
      - name: Check data integrity and normalization
        run: npm test
      - name: Build static website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
